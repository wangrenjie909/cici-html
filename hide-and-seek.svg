<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- 天空渐变 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8e8d8"/>
      <stop offset="60%" stop-color="#a8d4c0"/>
      <stop offset="100%" stop-color="#88c0a8"/>
    </linearGradient>
    <!-- 草地渐变 -->
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ab890"/>
      <stop offset="100%" stop-color="#5a9a70"/>
    </linearGradient>
    <!-- 树皮渐变 -->
    <linearGradient id="bark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5a3e2a"/>
      <stop offset="50%" stop-color="#7a5a3a"/>
      <stop offset="100%" stop-color="#4a3220"/>
    </linearGradient>
    <!-- 肤色 -->
    <radialGradient id="skin" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#fff0e0"/>
      <stop offset="100%" stop-color="#fdd5b5"/>
    </radialGradient>
    <radialGradient id="skinChild" cx="40%" cy="30%">
      <stop offset="0%" stop-color="#fff5eb"/>
      <stop offset="100%" stop-color="#fdd5b5"/>
    </radialGradient>
    <!-- 腮红 -->
    <radialGradient id="blush">
      <stop offset="0%" stop-color="#ffb3d9" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffb3d9" stop-opacity="0"/>
    </radialGradient>
    <!-- 阳光 -->
    <radialGradient id="sunbeam" cx="50%" cy="0%">
      <stop offset="0%" stop-color="rgba(255,240,200,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,240,200,0)"/>
    </radialGradient>
  </defs>

  <!-- ===== 天空 ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- ===== 阳光 ===== -->
  <rect width="800" height="600" fill="url(#sunbeam)"/>

  <!-- ===== 远景树（浅色） ===== -->
  <g opacity="0.35">
    <path d="M100,200 L80,400 L120,400 Z" fill="#5a9a70"/>
    <path d="M100,180 L60,400 L140,400 Z" fill="#4a8a60" opacity="0.5"/>
    <path d="M250,160 L220,400 L280,400 Z" fill="#5a9a70"/>
    <path d="M650,180 L620,400 L680,400 Z" fill="#4a8a60"/>
    <path d="M720,200 L690,400 L750,400 Z" fill="#5a9a70"/>
  </g>

  <!-- ===== 中景树 ===== -->
  <g opacity="0.5">
    <!-- 左侧树 -->
    <rect x="175" y="250" width="20" height="200" fill="#6a4a32" rx="3"/>
    <ellipse cx="185" cy="220" rx="70" ry="80" fill="#4a8a5a"/>
    <ellipse cx="160" cy="240" rx="45" ry="55" fill="#5a9a6a"/>
    <ellipse cx="210" cy="230" rx="50" ry="60" fill="#3a7a4a"/>

    <!-- 右侧树 -->
    <rect x="615" y="260" width="18" height="200" fill="#6a4a32" rx="3"/>
    <ellipse cx="624" cy="230" rx="65" ry="75" fill="#4a8a5a"/>
    <ellipse cx="600" cy="250" rx="40" ry="50" fill="#5a9a6a"/>
    <ellipse cx="648" cy="240" rx="45" ry="55" fill="#3a7a4a"/>
  </g>

  <!-- ===== 草丛（中景） ===== -->
  <g opacity="0.4">
    <ellipse cx="130" cy="420" rx="60" ry="20" fill="#5a9a60"/>
    <ellipse cx="300" cy="430" rx="50" ry="15" fill="#4a8a50"/>
    <ellipse cx="550" cy="425" rx="55" ry="18" fill="#5a9a60"/>
    <ellipse cx="680" cy="430" rx="45" ry="15" fill="#4a8a50"/>
  </g>

  <!-- ===== 地面 ===== -->
  <ellipse cx="400" cy="520" rx="450" ry="120" fill="url(#grass)"/>
  <rect x="0" y="480" width="800" height="120" fill="url(#grass)"/>

  <!-- ===== 前景大树（捉迷藏的树） ===== -->
  <!-- 树干 -->
  <rect x="340" y="200" width="50" height="300" fill="url(#bark)" rx="5"/>
  <!-- 树根 -->
  <ellipse cx="365" cy="498" rx="40" ry="8" fill="#5a3e2a"/>
  <!-- 树洞装饰 -->
  <ellipse cx="358" cy="380" rx="12" ry="16" fill="#3a2210" opacity="0.5"/>
  <!-- 树枝 -->
  <path d="M340,260 Q300,240 280,250" stroke="#6a4a32" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M390,240 Q420,220 440,230" stroke="#6a4a32" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M345,220 Q320,200 310,190" stroke="#6a4a32" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 树冠 -->
  <ellipse cx="365" cy="180" rx="100" ry="90" fill="#3a7a4a"/>
  <ellipse cx="320" cy="200" rx="70" ry="70" fill="#4a8a5a"/>
  <ellipse cx="410" cy="190" rx="65" ry="75" fill="#2a6a3a"/>
  <ellipse cx="365" cy="160" rx="55" ry="50" fill="#5a9a6a"/>
  <!-- 树叶高光 -->
  <ellipse cx="340" cy="150" rx="25" ry="20" fill="#6aaa7a" opacity="0.4"/>
  <ellipse cx="390" cy="170" rx="20" ry="15" fill="#6aaa7a" opacity="0.3"/>

  <!-- ===== 小草丛（前景） ===== -->
  <g fill="#5aaa60" opacity="0.7">
    <path d="M120,500 Q125,470 130,500 Q135,475 140,500" stroke="#4a9a50" stroke-width="2" fill="none"/>
    <path d="M150,505 Q155,480 160,505" stroke="#4a9a50" stroke-width="2" fill="none"/>
    <path d="M550,495 Q555,470 560,495 Q565,475 570,495" stroke="#4a9a50" stroke-width="2" fill="none"/>
    <path d="M640,500 Q645,478 650,500" stroke="#4a9a50" stroke-width="2" fill="none"/>
  </g>

  <!-- ===== 小花 ===== -->
  <g>
    <circle cx="140" cy="490" r="4" fill="#ffd0d0"/>
    <circle cx="140" cy="490" r="2" fill="#ffa070"/>
    <circle cx="580" cy="488" r="4" fill="#ffd0d0"/>
    <circle cx="580" cy="488" r="2" fill="#ffa070"/>
    <circle cx="260" cy="500" r="3.5" fill="#ffd0d0"/>
    <circle cx="260" cy="500" r="1.8" fill="#ffa070"/>
    <circle cx="620" cy="495" r="3" fill="#ffe0e0"/>
    <circle cx="620" cy="495" r="1.5" fill="#ffb080"/>
  </g>

  <!-- ===== 蝴蝶 ===== -->
  <g transform="translate(500, 280)" opacity="0.6">
    <path d="M0,0 Q-10,-8 -5,-2 Q-10,4 0,0" fill="#ffb0d0" stroke="#ff80a0" stroke-width="0.5"/>
    <path d="M0,0 Q10,-8 5,-2 Q10,4 0,0" fill="#ffc0d8" stroke="#ff80a0" stroke-width="0.5"/>
    <line x1="0" y1="-1" x2="0" y2="2" stroke="#8a6040" stroke-width="1"/>
  </g>

  <!-- ============================================================ -->
  <!--  姐姐（藏在树后，探出头） -->
  <!-- ============================================================ -->
  <g id="sister-hiding" transform="translate(310, 310)">
    <!-- 身体（露出半边） -->
    <path d="M20,40 L10,110 L60,110 L55,40 Z" fill="#ce93d8"/>
    <!-- 手臂（扶着树） -->
    <path d="M15,55 Q5,65 0,60" fill="url(#skin)" stroke="#e8c5a0" stroke-width="0.8"/>
    <path d="M55,55 Q65,60 62,55" fill="url(#skin)" stroke="#e8c5a0" stroke-width="0.8"/>

    <!-- 头 -->
    <ellipse cx="38" cy="25" rx="20" ry="22" fill="url(#skin)"/>

    <!-- 头发 -->
    <path d="M18,18 Q16,5 25,8 Q30,2 38,5 Q46,2 50,8 Q60,5 58,18" fill="#6d4c41"/>
    <path d="M18,18 Q15,30 16,45 Q17,55 19,60" fill="#6d4c41"/>
    <path d="M58,18 Q61,30 60,45 Q59,55 57,60" fill="#6d4c41"/>

    <!-- 刘海 -->
    <path d="M18,18 Q20,10 28,12 Q32,6 38,8 Q44,6 48,12 Q56,10 58,18" fill="#6d4c41"/>

    <!-- 眼睛（开心的眯眼笑） -->
    <path d="M28,24 Q32,21 36,24" stroke="#3e2723" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M40,24 Q44,21 48,24" stroke="#3e2723" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- 腮红 -->
    <ellipse cx="26" cy="30" rx="5" ry="3" fill="url(#blush)"/>
    <ellipse cx="50" cy="30" rx="5" ry="3" fill="url(#blush)"/>

    <!-- 嘴巴（偷笑） -->
    <path d="M35 30 Q38 34 41 30" stroke="#c44d4d" stroke-width="1.5" fill="none" stroke-linecap="round"/>

    <!-- "嘘"的手势 -->
    <g transform="translate(60, 20)">
      <circle cx="0" cy="0" r="5" fill="url(#skin)"/>
      <line x1="3" y1="-3" x2="10" y2="-8" stroke="#fdd5b5" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!--  妹妹（在找姐姐） -->
  <!-- ============================================================ -->
  <g id="child-seeking" transform="translate(520, 360)">
    <!-- 身体 -->
    <path d="M15,35 L12,90 L42,90 L40,35 Z" fill="#fff176"/>

    <!-- 裙子 -->
    <path d="M12,90 L8,110 Q27,115 46,110 L42,90 Z" fill="#f8bbd0"/>

    <!-- 左臂（张开） -->
    <path d="M12,45 Q5,55 0,50" fill="url(#skinChild)" stroke="#e8c5a0" stroke-width="0.8"/>
    <path d="M42,45 Q50,50 48,45" fill="url(#skinChild)" stroke="#e8c5a0" stroke-width="0.8"/>

    <!-- 腿 -->
    <line x1="20" y1="110" x2="18" y2="130" stroke="#fdd5b5" stroke-width="4" stroke-linecap="round"/>
    <line x1="34" y1="110" x2="36" y2="130" stroke="#fdd5b5" stroke-width="4" stroke-linecap="round"/>

    <!-- 鞋子 -->
    <ellipse cx="17" cy="132" rx="7" ry="3.5" fill="#ff80ab"/>
    <ellipse cx="37" cy="132" rx="7" ry="3.5" fill="#ff80ab"/>

    <!-- 头 -->
    <ellipse cx="28" cy="18" rx="17" ry="19" fill="url(#skinChild)"/>

    <!-- 头发 -->
    <path d="M11,12 Q10,-2 18,2 Q22,-4 28,-1 Q34,-4 38,2 Q46,-2 45,12" fill="#5d4037"/>
    <!-- 双马尾 -->
    <path d="M12,12 Q6,8 4,18 Q2,28 6,32 Q10,30 12,22" fill="#5d4037"/>
    <path d="M44,12 Q50,8 52,18 Q54,28 50,32 Q46,30 44,22" fill="#5d4037"/>

    <!-- 马尾蝴蝶结 -->
    <g transform="translate(5,16)">
      <path d="M0,0 Q-4,-3 -3,-1 Q-1,0 0,0" fill="#ff80ab"/>
      <path d="M0,0 Q4,-3 3,-1 Q1,0 0,0" fill="#ff80ab"/>
      <circle cx="0" cy="0" r="1.2" fill="#ff4081"/>
    </g>
    <g transform="translate(51,16)">
      <path d="M0,0 Q-4,-3 -3,-1 Q-1,0 0,0" fill="#ff80ab"/>
      <path d="M0,0 Q4,-3 3,-1 Q1,0 0,0" fill="#ff80ab"/>
      <circle cx="0" cy="0" r="1.2" fill="#ff4081"/>
    </g>

    <!-- 刘海 -->
    <path d="M12,12 Q14,4 22,6 Q26,1 28,3 Q30,1 34,6 Q42,4 44,12" fill="#5d4037"/>

    <!-- 大眼睛 -->
    <ellipse cx="21" cy="18" rx="5" ry="6.5" fill="#3e2723"/>
    <ellipse cx="21" cy="17" rx="4" ry="5.5" fill="#4e342e"/>
    <ellipse cx="19" cy="15" rx="2" ry="2.5" fill="white" opacity="0.9"/>
    <circle cx="22.5" cy="20" r="1.3" fill="white" opacity="0.5"/>

    <ellipse cx="35" cy="18" rx="5" ry="6.5" fill="#3e2723"/>
    <ellipse cx="35" cy="17" rx="4" ry="5.5" fill="#4e342e"/>
    <ellipse cx="33" cy="15" rx="2" ry="2.5" fill="white" opacity="0.9"/>
    <circle cx="36.5" cy="20" r="1.3" fill="white" opacity="0.5"/>

    <!-- 腮红 -->
    <ellipse cx="15" cy="26" rx="4.5" ry="2.8" fill="url(#blush)"/>
    <ellipse cx="41" cy="26" rx="4.5" ry="2.8" fill="url(#blush)"/>

    <!-- 嘴巴（喊话） -->
    <ellipse cx="28" cy="27" rx="4" ry="3" fill="#c44d4d"/>
    <ellipse cx="28" cy="26" rx="3" ry="1.5" fill="#ff8a80"/>

    <!-- ===== 对话气泡 ===== -->
    <g transform="translate(15, -30)">
      <path d="M0,0 Q-5,-20 10,-25 Q25,-30 35,-22 Q45,-14 30,-5 Q28,-3 25,0 Q23,3 18,0 Q15,-3 10,0 Z" fill="white" opacity="0.85"/>
      <text x="14" y="-12" font-size="10" fill="#5d4037" font-weight="bold">姐姐～</text>
      <text x="10" y="-3" font-size="8" fill="#5d4037">你在哪？</text>
    </g>
  </g>

  <!-- ===== 飘落的树叶 ===== -->
  <g opacity="0.5">
    <ellipse cx="200" cy="180" rx="6" ry="3" fill="#6aaa60" transform="rotate(30 200 180)">
      <animateTransform attributeName="transform" type="translate" values="0,0;20,80;40,160" dur="8s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <ellipse cx="600" cy="200" rx="5" ry="2.5" fill="#7aba70" transform="rotate(-20 600 200)">
      <animateTransform attributeName="transform" type="translate" values="0,0;-15,60;-30,140" dur="10s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
    <ellipse cx="450" cy="150" rx="4" ry="2" fill="#5a9a50" transform="rotate(45 450 150)">
      <animateTransform attributeName="transform" type="translate" values="0,0;10,50;20,120" dur="12s" repeatCount="indefinite" additive="sum"/>
    </ellipse>
  </g>

  <!-- ===== 树上的小爱心 ===== -->
  <g transform="translate(380, 290)" opacity="0.3">
    <path d="M0,-2 Q-3,-6 -5,-3 Q-7,0 0,5 Q7,0 5,-3 Q3,-6 0,-2 Z" fill="#ff80ab"/>
  </g>
  <g transform="translate(420, 340)" opacity="0.2">
    <path d="M0,-2 Q-3,-6 -5,-3 Q-7,0 0,5 Q7,0 5,-3 Q3,-6 0,-2 Z" fill="#ff80ab"/>
  </g>

</svg>
