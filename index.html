    <style>

        .scene-creature.butterfly {

        }
        .scene-creature.mote {

        .scene-creature.falling {

        }
        @keyframes butterflyFly {
            0% { opacity:0.8; transform:translate(0,0) rotate(0deg) scale(0.8); }
            25% { opacity:1; transform:translate(60px,-40px) rotate(8deg) scale(1.1); }
            50% { opacity:0.9; transform:translate(120px,-20px) rotate(-5deg) scale(0.9); }
            75% { opacity:1; transform:translate(180px,-50px) rotate(6deg) scale(1); }
            100% { opacity:0.8; transform:translate(250px,-30px) rotate(0deg) scale(0.8); }
        }
        @keyframes birdFly {
            0% { opacity:0.9; transform:translate(0,0) scale(0.7); }
            20% { opacity:1; transform:translate(80px,-30px) scale(1); }
            45% { opacity:0.95; transform:translate(180px,-15px) scale(1.1); }
            70% { opacity:1; transform:translate(280px,-40px) scale(1); }
            100% { opacity:0.9; transform:translate(380px,-20px) scale(0.8); }

        @keyframes moteFloat {
            0% { opacity:0.5; transform:translate(0,0) scale(0.6); }

            50% { opacity:0.7; transform:translate(-15px,-55px) scale(0.8); }
            75% { opacity:1; transform:translate(20px,-80px) scale(1.2); }
            100% { opacity:0.5; transform:translate(-10px,-110px) scale(0.6); }
        }
        @keyframes wispRise {
            0% { opacity:0.3; transform:translateY(0) scale(0.5); }
            20% { opacity:0.6; transform:translate(-20px,-30px) scale(0.9); }
            45% { opacity:0.4; transform:translate(15px,-65px) scale(1.2); }
            70% { opacity:0.3; transform:translate(-10px,-100px) scale(1.6); }

        @keyframes fallDown {
            0% { opacity:0; transform:translateY(-20px) scale(0.5); }

        var audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            return audioCtx;
        }

        var NOTE_FREQ = {
            'C4':261.63,'C#4':277.18,'D4':293.66,'D#4':311.13,'E4':329.63,
            'F4':349.23,'F#4':369.99,'G4':392.00,'G#4':415.30,'A4':440.00,
            'A#4':466.16,'B4':493.88,
            'C5':523.25,'C#5':554.37,'D5':587.33,'D#5':622.25,'E5':659.25,
            'F5':698.46,'F#5':739.99,'G5':783.99,'G#5':830.61,'A5':880.00,
            'A#5':932.33,'B5':987.77
        };
        var NOTE_NAMES = {
            'C4':'C','C#4':'C#/Db','D4':'D','D#4':'D#/Eb','E4':'E',
            'F4':'F','F#4':'F#/Gb','G4':'G','G#4':'G#/Ab','A4':'A',
            'A#4':'A#/Bb','B4':'B',
            'C5':'C','C#5':'C#/Db','D5':'D','D#5':'D#/Eb','E5':'E',
            'F5':'F','F#5':'F#/Gb','G5':'G','G#5':'G#/Ab','A5':'A',
            'A#5':'A#/Bb','B5':'B'
        };
        var WHITE_KEYS = ['C4','D4','E4','F4','G4','A4','B4','C5','D5','E5','F5','G5','A5','B5'];
        var BLACK_KEYS = ['C#4','D#4','F#4','G#4','A#4','C#5','D#5','F#5','G#5','A#5'];
        var bkPositions = [1, 2, 4, 5, 6, 8, 9, 11, 12, 13];

        function playNote(note, dur) {
            var ctx = getAudioCtx();
            var freq = NOTE_FREQ[note];
            if (!freq) return;
            var osc = ctx.createOscillator();
            var gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (dur || 0.8));
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime);
            osc.stop(ctx.currentTime + (dur || 0.8));
        }

        function hitKey(note) {
            var el = document.querySelector('[data-note="'+note+'"]');
            if (el) { el.classList.add('hit'); setTimeout(function(){ el.classList.remove('hit'); }, 300); }
        }

            }
            var bkHtml = '';
            for (var i = 0; i < BLACK_KEYS.length; i++) {
                var n = BLACK_KEYS[i];

        /* ===== Maze Game ===== */
        var MAZE_ROWS = 13, MAZE_COLS = 13;
        var mazeGrid = [], mazePlayerR = 1, mazePlayerC = 1;

        function generateMaze(rows, cols) {
            var h = rows * 2 + 1, w = cols * 2 + 1;
            var grid = [];
            for (var r = 0; r < h; r++) { grid[r] = []; for (var c = 0; c < w; c++) grid[r][c] = 1; }

            function carve(r, c) {
                var gr = r * 2 + 1, gc = c * 2 + 1;
                grid[gr][gc] = 0;
                var dirs = [[0,1],[1,0],[0,-1],[-1,0]];
                for (var i = dirs.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var tmp = dirs[i]; dirs[i] = dirs[j]; dirs[j] = tmp;
                }
                for (var d = 0; d < dirs.length; d++) {
                    var dr = dirs[d][0], dc = dirs[d][1];
                    var nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr*2+1][nc*2+1] === 1) {
                        grid[gr + dr][gc + dc] = 0;
                        carve(nr, nc);
                    }
                }
            }
            carve(0, 0);

            // 随机打通额外墙壁 — 制造环路和多条路径，让迷宫错综复杂
            for (var r = 2; r < h - 1; r += 2) {
                for (var c = 2; c < w - 1; c += 2) {
                    if (Math.random() < 0.35) {
                        var dirs = [];
                        if (r > 1) dirs.push([-1, 0]);
                        if (r < h - 2) dirs.push([1, 0]);
                        if (c > 1) dirs.push([0, -1]);
                        if (c < w - 2) dirs.push([0, 1]);
                        if (dirs.length > 0) {
                            var chosen = dirs[Math.floor(Math.random() * dirs.length)];
                            var wr = r + chosen[0], wc = c + chosen[1];
                            if (wr > 0 && wr < h - 1 && wc > 0 && wc < w - 1) {
                                grid[wr][wc] = 0;
                            }
                        }
                    }
                }
            }

            grid[0][1] = 0;       // entrance
            grid[h-1][w-2] = 0;   // exit
            return grid;
        }

        function renderMaze() {
            var container = document.getElementById('mazeGrid');
            if (!container) return;
            container.innerHTML = '';
            var h = mazeGrid.length, w = mazeGrid[0].length;
            container.style.gridTemplateColumns = 'repeat(' + w + ', 1fr)';
            for (var r = 0; r < h; r++) {
                for (var c = 0; c < w; c++) {
                    var cell = document.createElement('div');
                    cell.className = 'maze-cell';
                    if (r === 0 && c === 1) cell.className += ' maze-entrance';
                    else if (r === h-1 && c === w-2) cell.className += ' maze-exit';
                    else if (r === mazePlayerR && c === mazePlayerC) cell.className += ' maze-player';
                    else if (mazeGrid[r][c] === 1) cell.className += ' maze-wall';
                    else cell.className += ' maze-path';
                    container.appendChild(cell);
                }
            }
        }

        function movePlayer(dr, dc) {
            var nr = mazePlayerR + dr, nc = mazePlayerC + dc;
            var h = mazeGrid.length, w = mazeGrid[0].length;
            if (nr < 0 || nr >= h || nc < 0 || nc >= w) return false;
            if (mazeGrid[nr][nc] === 1) return false;
            mazePlayerR = nr;
            mazePlayerC = nc;
            renderMaze();
            if (nr === h-1 && nc === w-2) {
                document.getElementById('mazeWinOverlay').classList.add('show');
            }
            return true;
        }

                snakeGrid[x] = [];
                for (var y = 0; y <= SNAKE_ROWS + 1; y++) {
                    snakeGrid[x][y] = (x === 0 || x === SNAKE_COLS+1 || y === 0 || y === SNAKE_ROWS+1) ? 1 : 0;
                }
            }
        }

        function updateSnakeGrid() {
            rebuildSnakeGrid();
            for (var i = 0; i < snakeFoods.length; i++) {
                var f = snakeFoods[i];
                if (f.x >= 1 && f.x <= SNAKE_COLS && f.y >= 1 && f.y <= SNAKE_ROWS)
                    snakeGrid[f.x][f.y] = 2;
            }
            function markSnake(seg, alive) {
                for (var i = 0; i < seg.length; i++) {
                    var s = seg[i];
                    if (s.x >= 1 && s.x <= SNAKE_COLS && s.y >= 1 && s.y <= SNAKE_ROWS)
                        snakeGrid[s.x][s.y] = alive ? 3 : 0;
                }
            }
            if (snakePlayer && snakePlayer.alive) markSnake(snakePlayer.segments, true);
            for (var i = 0; i < snakeAIs.length; i++) {
                if (snakeAIs[i].alive) markSnake(snakeAIs[i].segments, true);
            }
        }

        function spawnFoods(count) {
            for (var i = 0; i < count; i++) {
                spawnOneFood();
            }
        }

        function spawnOneFood() {
            var tries = 0;
            while (tries < 200) {
                var x = 1 + Math.floor(Math.random() * SNAKE_COLS);
                var y = 1 + Math.floor(Math.random() * SNAKE_ROWS);
                if (snakeGrid[x][y] === 0) {
                    var ft = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
                    snakeFoods.push({x:x, y:y, color:ft.color, label:ft.label});
                    snakeGrid[x][y] = 2;
                    return;
                }
                tries++;
            }
        }

        function runSnakeLoop() {
            if (snakeLoopTimer) clearInterval(snakeLoopTimer);
            var speed = snakeBoostActive ? 130 : 220;
            snakeLoopTimer = setInterval(function() {
                if (!snakeRunning) return;
                updateSnake();
                renderSnake();
            }, speed);
        }

        function updateSnake() {
            // Apply player direction
            snakeDir = {x:snakeNextDir.x, y:snakeNextDir.y};

            // Move AI snakes
            for (var i = 0; i < snakeAIs.length; i++) {
                aiMove(snakeAIs[i], i);
            }

            // Move player
            if (snakePlayer && snakePlayer.alive) {
                var head = snakePlayer.segments[0];
                var nx = head.x + snakeDir.x, ny = head.y + snakeDir.y;
                moveSnake(snakePlayer, nx, ny);
            }

            // Check AI vs AI / AI vs player collisions
            checkSnakeCollisions();

            // Replenish food
            while (snakeFoods.length < 12) spawnOneFood();

            updateSnakeGrid();
        }

        function moveSnake(snake, nx, ny) {
            // Wall collision
            if (nx < 1 || nx > SNAKE_COLS || ny < 1 || ny > SNAKE_ROWS) {
                snake.alive = false;
                snakeDie(snake);
                return;
            }

            var ate = false;
            // Check food
            for (var i = 0; i < snakeFoods.length; i++) {
                var f = snakeFoods[i];
                if (f.x === nx && f.y === ny) {
                    ate = true;
                    snakeFoods.splice(i, 1);
                    if (snake === snakePlayer) snakeScore++;
                    break;
                }
            }

            var seg = snake.segments;
            seg.unshift({x:nx, y:ny});
            if (!ate) seg.pop();
        }

        function snakeDie(snake) {
            // Convert body to food
            for (var i = 0; i < snake.segments.length; i++) {
                var s = snake.segments[i];
                if (s.x >= 1 && s.x <= SNAKE_COLS && s.y >= 1 && s.y <= SNAKE_ROWS && snakeGrid[s.x][s.y] !== 2) {
                    var ft = FOOD_TYPES[Math.floor(Math.random() * FOOD_TYPES.length)];
                    snakeFoods.push({x:s.x, y:s.y, color:ft.color, label:ft.label});
                }
            }
            snake.segments = [];

            if (snake === snakePlayer) {
                gameOverSnake();
            } else {
                // Check if all AI snakes are dead → player wins
                var allDead = true;
                for (var i = 0; i < snakeAIs.length; i++) {
                    if (snakeAIs[i].alive) { allDead = false; break; }
                }
                if (allDead) winSnake();
            }
        }

        function checkSnakeCollisions() {
            var allSnakes = [];
            if (snakePlayer && snakePlayer.alive) allSnakes.push(snakePlayer);
            for (var i = 0; i < snakeAIs.length; i++) {
                if (snakeAIs[i].alive) allSnakes.push(snakeAIs[i]);
            }

            for (var a = 0; a < allSnakes.length; a++) {
                for (var b = 0; b < allSnakes.length; b++) {
                    if (a === b) continue;
                    var headA = allSnakes[a].segments[0];
                    if (!headA) continue;
                    for (var s = 0; s < allSnakes[b].segments.length; s++) {
                        if (allSnakes[b].segments[s].x === headA.x && allSnakes[b].segments[s].y === headA.y) {
                            allSnakes[a].alive = false;
                            snakeDie(allSnakes[a]);
                            break;
                        }
                    }
                }
            }
        }

        function gameOverSnake() {
            stopSnake();
            document.getElementById('snakeOverScore').textContent = '得分: ' + snakeScore;
            document.getElementById('snakeOverlay').classList.add('show');
        }

        function winSnake() {
            stopSnake();
            document.getElementById('snakeWinOverlay').classList.add('show');
        }

        function aiMove(snake, idx) {
            if (!snake.alive || snake.segments.length === 0) return;
            var head = snake.segments[0];
            // Look at all 4 directions
            var dirs = [{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}];
            var safe = [];
            for (var d = 0; d < dirs.length; d++) {
                var nx = head.x + dirs[d].x, ny = head.y + dirs[d].y;
                if (nx < 1 || nx > SNAKE_COLS || ny < 1 || ny > SNAKE_ROWS) continue;
                var blocked = false;
                // Check other snakes' bodies
                if (snakePlayer && snakePlayer.alive) {
                    for (var s = 0; s < snakePlayer.segments.length; s++) {
                        if (snakePlayer.segments[s].x === nx && snakePlayer.segments[s].y === ny) { blocked = true; break; }
                    }
                }
                if (!blocked) {
                    for (var ai = 0; ai < snakeAIs.length; ai++) {
                        if (ai === idx || !snakeAIs[ai].alive) continue;
                        for (var s = 0; s < snakeAIs[ai].segments.length; s++) {
                            if (snakeAIs[ai].segments[s].x === nx && snakeAIs[ai].segments[s].y === ny) { blocked = true; break; }
                        }
                        if (blocked) break;
                    }
                }
                // Check own body
                if (!blocked) {
                    for (var s = 0; s < snake.segments.length - 1; s++) {
                        if (snake.segments[s].x === nx && snake.segments[s].y === ny) { blocked = true; break; }
                    }
                }
                if (!blocked) safe.push(dirs[d]);
            }

            var chosen;
            if (safe.length === 0) {
                // All directions blocked, try any
                chosen = dirs[Math.floor(Math.random() * 4)];
            } else {
                // Find nearest food
                var bestDir = safe[0], bestDist = Infinity;
                for (var d = 0; d < safe.length; d++) {
                    var tx = head.x + safe[d].x, ty = head.y + safe[d].y;
                    for (var f = 0; f < snakeFoods.length; f++) {
                        var dist = Math.abs(snakeFoods[f].x - tx) + Math.abs(snakeFoods[f].y - ty);
                        if (dist < bestDist) { bestDist = dist; bestDir = safe[d]; }
                    }
                }
                // Some randomness
                if (Math.random() < 0.2 && safe.length > 1) {
                    chosen = safe[Math.floor(Math.random() * safe.length)];
                } else {
                    chosen = bestDir;
                }
            }

            snake.dir = {x:chosen.x, y:chosen.y};
            var nx = head.x + chosen.x, ny = head.y + chosen.y;
            moveSnake(snake, nx, ny);
        }

        function renderSnake() {
            var ctx = snakeCtx, cw = snakeCanvas.width, ch = snakeCanvas.height;
            ctx.clearRect(0, 0, cw, ch);

            // Background
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, cw, ch);

            // Grid lines
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.lineWidth = 0.5;
            for (var x = 0; x <= SNAKE_COLS + 1; x++) {
                ctx.beginPath(); ctx.moveTo(x*CELL_SIZE, 0); ctx.lineTo(x*CELL_SIZE, ch); ctx.stroke();
            }
            for (var y = 0; y <= SNAKE_ROWS + 1; y++) {
                ctx.beginPath(); ctx.moveTo(0, y*CELL_SIZE); ctx.lineTo(cw, y*CELL_SIZE); ctx.stroke();
            }

            // Walls
            ctx.fillStyle = '#2d2d44';
            for (var x = 0; x <= SNAKE_COLS + 1; x++) {
                for (var y = 0; y <= SNAKE_ROWS + 1; y++) {
                    if (snakeGrid[x] && snakeGrid[x][y] === 1) {
                        ctx.fillRect(x*CELL_SIZE, y*CELL_SIZE, CELL_SIZE, CELL_SIZE);
                    }
                }
            }

            // Foods
            for (var i = 0; i < snakeFoods.length; i++) {
                var f = snakeFoods[i];
                ctx.fillStyle = f.color;
                ctx.beginPath();
                ctx.arc((f.x+0.5)*CELL_SIZE, (f.y+0.5)*CELL_SIZE, CELL_SIZE*0.4, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowColor = f.color;
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            // Draw snake body
            function drawSnakeBody(segments, color, isPlayer, name) {
                for (var i = segments.length - 1; i >= 0; i--) {
                    var s = segments[i];
                    var pad = isPlayer ? 1 : 2;
                    var sz = CELL_SIZE - pad * 2;
                    var alpha = 1 - i * 0.04;
                    if (alpha < 0.4) alpha = 0.4;
                    ctx.globalAlpha = alpha;
                    if (isPlayer) {
                        ctx.fillStyle = i === 0 ? '#00e676' : '#00e676';
                        ctx.shadowColor = '#00e676';
                        ctx.shadowBlur = i === 0 ? 16 : 4;
                    } else {
                        ctx.fillStyle = i === 0 ? color : color;
                        ctx.shadowColor = color;
                        ctx.shadowBlur = i === 0 ? 8 : 0;
                    }
                    var radius = (sz / 2) * (i === 0 ? 1 : 0.8);
                    ctx.beginPath();
                    ctx.arc((s.x+0.5)*CELL_SIZE, (s.y+0.5)*CELL_SIZE, radius, 0, Math.PI*2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;
                // Eyes on head
                if (segments.length > 0) {
                    var head = segments[0];
                    ctx.fillStyle = '#fff';
                    var cx = (head.x+0.5)*CELL_SIZE, cy = (head.y+0.5)*CELL_SIZE;
                    ctx.beginPath(); ctx.arc(cx-3, cy-3, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx+3, cy-3, 2.5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = '#111';
                    ctx.beginPath(); ctx.arc(cx-3, cy-3, 1.2, 0, Math.PI*2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx+3, cy-3, 1.2, 0, Math.PI*2); ctx.fill();
                    // Name label above head
                    ctx.fillStyle = isPlayer ? '#00e676' : color;
                    ctx.font = 'bold ' + Math.max(9, Math.floor(CELL_SIZE * 0.55)) + 'px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.shadowColor = 'rgba(0,0,0,0.8)';
                    ctx.shadowBlur = 4;
                    ctx.fillText(name, cx, cy - CELL_SIZE * 0.7);
                    ctx.shadowBlur = 0;
                }
            }

            if (snakePlayer && snakePlayer.alive) drawSnakeBody(snakePlayer.segments, '#00e676', true, snakePlayer.name);
            for (var i = 0; i < snakeAIs.length; i++) {
                if (snakeAIs[i].alive) drawSnakeBody(snakeAIs[i].segments, snakeAIs[i].color, false, snakeAIs[i].name);
            }

            // Score
            ctx.fillStyle = 'rgba(255,255,255,0.5)';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'left';
            ctx.fillText('得分: ' + snakeScore, 8, 18);
        }

        function setupSnakeControls() {
            // Keyboard
            document.addEventListener('keydown', function(e) {
                var p = document.getElementById('page11');
                if (!p || p.classList.contains('hidden')) return;
                switch (e.key) {
                    case 'ArrowUp': e.preventDefault(); if (snakeDir.y !== 1) snakeNextDir = {x:0,y:-1}; break;
                    case 'ArrowDown': e.preventDefault(); if (snakeDir.y !== -1) snakeNextDir = {x:0,y:1}; break;
                    case 'ArrowLeft': e.preventDefault(); if (snakeDir.x !== 1) snakeNextDir = {x:-1,y:0}; break;
                    case 'ArrowRight': e.preventDefault(); if (snakeDir.x !== -1) snakeNextDir = {x:1,y:0}; break;
                    case 'w': case 'W': e.preventDefault(); toggleSnakeBoost(true); break;
                }
            });
            document.addEventListener('keyup', function(e) {
                if (e.key === 'w' || e.key === 'W') toggleSnakeBoost(false);
            });

            // Steer wheel (mobile)
            var steer = document.getElementById('snakeSteer');
            if (steer) {
                steer.addEventListener('touchstart', function(e) {
                    var t = e.touches[0];
                    if (!t) return;
                    var r = steer.getBoundingClientRect();
                    snakeSteerTouch = {cx: r.left + r.width/2, cy: r.top + r.height/2};
                }, {passive:true});
                steer.addEventListener('touchmove', function(e) {
                    e.preventDefault();
                    var t = e.touches[0];
                    if (!t || !snakeSteerTouch) return;
                    var dx = t.clientX - snakeSteerTouch.cx;
                    var dy = t.clientY - snakeSteerTouch.cy;
                    var maxR = 50;
                    var dist = Math.sqrt(dx*dx + dy*dy);
                    var clamp = Math.min(dist, maxR);
                    var angle = Math.atan2(dy, dx);
                    var dot = document.getElementById('snakeSteerDot');
                    if (dot) {
                        dot.style.transform = 'translate(' + (Math.cos(angle)*clamp - 14) + 'px,' + (Math.sin(angle)*clamp - 14) + 'px)';
                    }
                    if (dist > 20) {
                        // Map to 4 directions
                        var a = Math.atan2(dy, dx);
                        if (a > -Math.PI/4 && a <= Math.PI/4) { if (snakeDir.x !== -1) snakeNextDir = {x:1,y:0}; }
                        else if (a > Math.PI/4 && a <= Math.PI*3/4) { if (snakeDir.y !== -1) snakeNextDir = {x:0,y:1}; }
                        else if (a > -Math.PI*3/4 && a <= -Math.PI/4) { if (snakeDir.y !== 1) snakeNextDir = {x:0,y:-1}; }
                        else { if (snakeDir.x !== 1) snakeNextDir = {x:-1,y:0}; }
                    }
                }, {passive:false});
                steer.addEventListener('touchend', function(e) {
                    var dot = document.getElementById('snakeSteerDot');
                    if (dot) dot.style.transform = 'translate(0px,0px)';
                    snakeSteerTouch = null;
                }, {passive:true});
            }

            // Boost button
            var boostBtn = document.getElementById('snakeBoost');
            if (boostBtn) {
                boostBtn.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    toggleSnakeBoost(true);
                    boostBtn.classList.add('active');
                }, {passive:false});
                boostBtn.addEventListener('touchend', function(e) {
                    toggleSnakeBoost(false);
                    boostBtn.classList.remove('active');
                }, {passive:true});
                boostBtn.addEventListener('click', function() {
                    // Desktop fallback for mobile controls
                });
            }
        }

        function toggleSnakeBoost(on) {
            if (on === snakeBoostActive) return;
            snakeBoostActive = on;
            if (snakeRunning) runSnakeLoop();
        }

        // Cleanup: hide intro-white after its CSS animation completes
        setTimeout(function() {
            var el = document.getElementById('intro-white');
            if (el) el.style.display = 'none';
        }, 12000);
    </script>
