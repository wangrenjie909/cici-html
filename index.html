<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>布丁的小世界</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: url('img2.jpg') center/cover no-repeat fixed;
            font-family: 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
            overflow-x: hidden;
            position: relative;
            color: #c8d6c0;
        }

        /* ===== 页面切换 ===== */
        .page {
            position: absolute;
            top: 0; left: 0;
            width: 100%; min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            transition: opacity 1s ease, transform 1s ease;
            z-index: 10;
        }

        .page.hidden {
            opacity: 0;
            transform: translateY(30px);
            pointer-events: none;
            z-index: 8;
        }

        /* ===== 主页标题（叠加在森林场景上） ===== */
        .main-title {
            font-size: 2.8em;
            color: rgba(200, 230, 210, 0.9);
            text-shadow:
                0 0 30px rgba(100, 180, 140, 0.3),
                0 0 60px rgba(80, 160, 120, 0.15),
                0 2px 4px rgba(0, 0, 0, 0.4);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 6px;
            font-weight: 600;
            animation: titleFloat 4s ease-in-out infinite;
            position: relative;
            z-index: 15;
            padding-top: 5vh;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0); text-shadow: 0 0 30px rgba(100, 180, 140, 0.3), 0 2px 4px rgba(0,0,0,0.4); }
            50% { transform: translateY(-6px); text-shadow: 0 0 40px rgba(120, 200, 160, 0.4), 0 0 80px rgba(80, 160, 120, 0.2), 0 2px 4px rgba(0,0,0,0.4); }
        }

        /* ===== 主页副标题 ===== */
        .main-subtitle {
            font-size: 1em;
            color: rgba(180, 210, 190, 0.6);
            text-shadow: 0 0 20px rgba(80, 160, 120, 0.2);
            text-align: center;
            letter-spacing: 8px;
            margin-bottom: 20px;
            position: relative;
            z-index: 15;
            animation: titleFloat 5s ease-in-out infinite 0.5s;
        }

        /* ===== 入口按钮 ===== */
        .enter-btn {
            display: inline-block;
            padding: 14px 48px;
            background: rgba(100, 160, 130, 0.15);
            border: 1px solid rgba(140, 200, 170, 0.25);
            border-radius: 30px;
            color: rgba(200, 230, 210, 0.8);
            font-size: 1.05em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.4s;
            letter-spacing: 4px;
            position: relative;
            z-index: 15;
            backdrop-filter: blur(4px);
            margin-top: 20px;
        }

        .enter-btn:hover {
            background: rgba(100, 160, 130, 0.25);
            border-color: rgba(140, 200, 170, 0.4);
            box-shadow: 0 0 30px rgba(100, 180, 140, 0.15);
            transform: scale(1.03);
        }

        /* ===== 内容卡片 ===== */
        .content-box {
            background: rgba(15, 30, 22, 0.6);
            border-radius: 12px;
            padding: 28px 32px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(140, 200, 170, 0.1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(200, 230, 210, 0.04);
            margin: 10px 0;
            position: relative;
            z-index: 12;
        }

        .diary-title {
            font-size: 1.4em;
            color: rgba(180, 220, 195, 0.9);
            margin-bottom: 16px;
            letter-spacing: 3px;
            font-weight: 500;
            text-shadow: 0 0 12px rgba(100, 180, 140, 0.15);
        }

        .diary-text {
            font-size: 1.05em;
            color: rgba(180, 205, 190, 0.85);
            line-height: 2;
        }

        .diary-text .highlight {
            color: rgba(160, 210, 180, 1);
            font-weight: 500;
            text-shadow: 0 0 8px rgba(120, 200, 160, 0.2);
        }

        /* ===== 页面指示器 ===== */
        .page-marker {
            font-size: 0.8em;
            color: rgba(140, 200, 170, 0.35);
            letter-spacing: 4px;
            margin-top: 16px;
            position: relative;
            z-index: 12;
        }

        /* ===== 返回按钮 ===== */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(15, 30, 22, 0.5);
            border: 1px solid rgba(140, 200, 170, 0.15);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .back-btn:hover {
            background: rgba(80, 160, 120, 0.2);
            border-color: rgba(140, 200, 170, 0.3);
            transform: scale(1.08);
        }

        /* ===== 结尾回家按钮 ===== */
        .end-home {
            display: inline-block;
            margin-top: 18px;
            padding: 12px 36px;
            background: rgba(100, 160, 130, 0.12);
            border: 1px solid rgba(140, 200, 170, 0.2);
            border-radius: 25px;
            color: rgba(180, 220, 195, 0.8);
            font-size: 0.95em;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 3px;
            position: relative;
            z-index: 12;
        }

        .end-home:hover {
            background: rgba(100, 160, 130, 0.2);
            border-color: rgba(140, 200, 170, 0.35);
            box-shadow: 0 0 20px rgba(100, 180, 140, 0.1);
        }

        /* ===== 结束语 ===== */
        .end-text {
            font-size: 0.9em;
            color: rgba(160, 200, 180, 0.5);
            margin-top: 8px;
            letter-spacing: 2px;
        }

        @media (max-width: 500px) {
            .main-title { font-size: 1.8em; letter-spacing: 4px; }
            .content-box { padding: 20px 18px; }
            .diary-title { font-size: 1.1em; }
            .diary-text { font-size: 0.95em; }
            .enter-btn { padding: 12px 32px; font-size: 0.95em; }
        }
    </style>
</head>
<body>



    <!-- ===== 返回按钮 ===== -->
    <button class="back-btn" id="backBtn" onclick="goToPage1()" style="display:none;">🏠</button>

    <!-- ================================================================ -->
    <!-- ===== 第1页：主页（文案 + 入口） ===== -->
    <!-- ================================================================ -->
    <div class="page" id="page1">
        <div class="main-title">欢迎来到布丁的小世界</div>
        <div class="main-subtitle">✦ 欢迎来到我的小世界 ✦</div>
        <button class="enter-btn" onclick="goToPage2()">踏 上 木 桥  ➔</button>
    </div>

    <!-- ================================================================ -->
    <!-- ===== 内容页由 JS 生成 ===== -->
    <!-- ================================================================ -->
    <div id="pageContainer"></div>

    <script>
        // ================================================================
        //  🌿 日记数据 — 5 页 + 结束页
        // ================================================================
        const diaryData = [
            // 第2页
            {
                title: '林间捉迷藏',
                text: '今天和 <span class="highlight">姐姐</span> 在森林里玩捉迷藏 🌲<br>' +
                      '我躲在大树后面，姐姐找了好久才找到我～<br>' +
                      '我们笑啊笑，连小鸟都被我们 <span class="highlight">逗乐了</span> 🐦'
            },
            // 第3页
            {
                title: '姐姐的森林野餐',
                text: '<span class="highlight">姐姐</span> 在小桥边铺了野餐垫 🧺<br>' +
                      '有三明治、果汁，还有我最爱的 <span class="highlight">小布丁</span> 🍮<br>' +
                      '阳光透过树叶洒下来，好 <span class="highlight">幸福</span> 呀～'
            },
            // 第4页
            {
                title: '一起采野花',
                text: '我和 <span class="highlight">姐姐</span> 在树林里采了好多野花 🌼<br>' +
                      '有白的、黄的、紫的，像 <span class="highlight">星星落在草地上</span> ✨<br>' +
                      '姐姐帮我编了一个花环，我戴上 <span class="highlight">舍不得摘</span> ～'
            },
            // 第5页
            {
                title: '桥边看月亮',
                text: '晚上 <span class="highlight">姐姐</span> 带我到小桥上看月亮 🌙<br>' +
                      '月光照在河面上，<span class="highlight">闪闪发光</span> 像碎银子～<br>' +
                      '姐姐给我讲嫦娥的故事，我 <span class="highlight">听完还不想睡</span> 🥰'
            },
            // 第6页
            {
                title: '雨中森林',
                text: '今天下 <span class="highlight">雨</span> 了，森林里雾蒙蒙的 ☔<br>' +
                      '我和姐姐撑着一把伞，走在 <span class="highlight">湿湿的木桥上</span> 🌂<br>' +
                      '雨滴落在叶子上，发出 <span class="highlight">嘀嗒嘀嗒</span> 的声音，好好听～'
            },
            // 第7页（最后一页）
            {
                title: '🍃 姐姐和我的快乐日常结束啦，拜拜 🍃',
                text: '谢谢 <span class="highlight">姐姐</span> 陪我走过的每一座桥、每一片森林 💚<br>' +
                      '和你在一起的每一天，就像 <span class="highlight">林间的微风</span> 一样温柔～<br>' +
                      '<span class="highlight">永远爱姐姐！</span> 🌟',
                isEnd: true
            }
        ];

        // ================================================================
        //  🏗️ 生成页面（第2～7页）
        // ================================================================
        function generatePages() {
            const container = document.getElementById('pageContainer');
            diaryData.forEach(function(page, idx) {
                const pageNum = idx + 2;
                const div = document.createElement('div');
                div.className = 'page hidden';
                div.id = 'page' + pageNum;

                let extraHtml = '';
                if (page.isEnd) {
                    extraHtml =
                        '<button class="end-home" onclick="showPage(1)">✦ 回到木桥 ✦</button>' +
                        '<div class="end-text">— 期待下一次冒险 —</div>';
                } else {
                    extraHtml = '<div class="page-marker">✦ ' + pageNum + ' / 7 ✦</div>';
                }

                div.innerHTML =
                    '<div class="content-box">' +
                        '<div class="diary-title">' + page.title + '</div>' +
                        '<div class="diary-text">' + page.text + '</div>' +
                    '</div>' +
                    '<div class="content-box">' +
                        extraHtml +
                    '</div>';

                container.appendChild(div);
            });
        }

        // ================================================================
        //  🧭 页面导航 + 自动翻页
        // ================================================================
        let autoTimer = null;

        function stopAutoAdvance() {
            if (autoTimer) {
                clearInterval(autoTimer);
                autoTimer = null;
            }
        }

        function startAutoAdvance(currentPage) {
            stopAutoAdvance();
            if (currentPage >= 7) return;
            autoTimer = setInterval(function() {
                const next = currentPage + 1;
                if (next <= 7) {
                    showPage(next);
                } else {
                    stopAutoAdvance();
                }
            }, 5000);
        }

        function showPage(num) {
            document.querySelectorAll('.page').forEach(function(p) {
                p.classList.add('hidden');
            });
            const target = document.getElementById('page' + num);
            if (target) target.classList.remove('hidden');
            document.getElementById('backBtn').style.display = num === 1 ? 'none' : 'block';

            // 切换背景：第1页用壁纸，第2页用捉迷藏图，其余用 hide-and-seek
            if (num === 1) {
                document.body.style.backgroundImage = "url('img2.jpg')";
            } else if (num === 2) {
                document.body.style.backgroundImage = "url('捉迷藏.jpg')";
            } else if (num === 3) {
                document.body.style.backgroundImage = "url('野餐.jpg')";
            } else if (num === 4) {
                document.body.style.backgroundImage = "url('采野花，做花环.jpg')";
            } else if (num === 5) {
                document.body.style.backgroundImage = "url('桥下讲故事.jpg')";
            } else if (num === 6) {
                document.body.style.backgroundImage = "url('下雨了.jpg')";
            } else {
                document.body.style.backgroundImage = "url('hide-and-seek.svg')";
            }

            stopAutoAdvance();
            if (num >= 2 && num < 7) {
                startAutoAdvance(num);
            }
        }

        function goToPage2() { showPage(2); }
        function goToPage1() { showPage(1); }

        // ================================================================
        //  🚀 启动
        // ================================================================
        generatePages();
    </script>

</body>
</html>
